name: "Nix: check for unused code"

on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - "**.nix"
      - ".github/workflows/deadnix.yml"

jobs:
  deadnix:
    name: Run deadnix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - name: Install Lix
        uses: ./.github/actions/install-lix

      - uses: phucleeuwu/deadnix-action@v1
